name: CI · glass-ui

# Runs only when this package, something it depends on, or the toolchain changes
# (docs/DECISIONS.md S7). Everything here is also verified locally before a push.
on:
  pull_request:
    paths:
      - 'packages/glass-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.nvmrc'
      - '.github/workflows/ci-glass-ui.yml'
  push:
    branches: [main]
    paths:
      - 'packages/glass-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.nvmrc'
      - '.github/workflows/ci-glass-ui.yml'

permissions:
  contents: read

concurrency:
  group: ci-glass-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: glass-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint packages/glass-ui

      - name: Typecheck
        run: npm run typecheck -w @glass/ui

      - name: Unit tests
        run: npm test -w @glass/ui
