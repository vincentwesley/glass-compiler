name: CI · Hub and site

# Runs only when this package, something it depends on, or the toolchain changes
# (docs/DECISIONS.md S7). Everything here is also verified locally before a push.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'site.config.mjs'
      - 'docs/screenshots/**'
      - 'site.config.d.mts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.nvmrc'
      - '.github/workflows/ci-hub.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'site.config.mjs'
      - 'docs/screenshots/**'
      - 'site.config.d.mts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.nvmrc'
      - '.github/workflows/ci-hub.yml'

permissions:
  contents: read

concurrency:
  group: ci-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Hub and site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint packages/hub scripts site.config.mjs

      - name: Typecheck
        run: npm run typecheck -w @glass/hub

      - name: Unit tests
        run: npm test -w @glass/hub

      - name: Build the whole site
        run: npm run build

      - name: Check the assembled site (CSP, credits, links, same origin)
        run: node scripts/check-site.mjs
