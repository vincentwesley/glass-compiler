[package]
name = "glass-wasm"
version = "0.1.0"
description = "A WebAssembly 1.0 virtual machine written from scratch, built to be looked through: text and binary front ends, a validator, and a steppable interpreter."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "glass-wasm"
path = "src/main.rs"

[dependencies]
